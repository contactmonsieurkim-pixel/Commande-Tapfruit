<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>재고 관리</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6f54">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f4; --card: #ffffff; --text: #1d2420; --muted: #66706b; --line: #dfe4e1;
      --brand: #1f6f54; --brand-ink: #ffffff; --brand-soft: #e3f0ea;
      --ok: #1f8a4c; --ok-bg: #e2f4e8; --warn: #8a5a00; --warn-bg: #fff1cc; --err: #c0392b; --err-bg: #fde4e1;
      --in: #2a78d6; --out: #eb6834; --admin: #6b3fa0; --admin-bg: #efe7f8;
      --shadow: 0 1px 2px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #121614; --card: #1c211e; --text: #e8ece9; --muted: #9aa49f; --line: #2c3430;
        --brand: #3fae86; --brand-ink: #0b1510; --brand-soft: #1d3329;
        --ok: #4cc27f; --ok-bg: #173323; --warn: #f2d675; --warn-bg: #3a3112; --err: #ff7b6b; --err-bg: #3d1d19;
        --in: #3987e5; --out: #d95926; --admin: #c3a3f0; --admin-bg: #2c2240;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #121614; --card: #1c211e; --text: #e8ece9; --muted: #9aa49f; --line: #2c3430;
      --brand: #3fae86; --brand-ink: #0b1510; --brand-soft: #1d3329;
      --ok: #4cc27f; --ok-bg: #173323; --warn: #f2d675; --warn-bg: #3a3112; --err: #ff7b6b; --err-bg: #3d1d19;
      --in: #3987e5; --out: #d95926; --admin: #c3a3f0; --admin-bg: #2c2240;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .hidden { display: none !important; }
    button, input, select, textarea { font: inherit; color: inherit; }

    /* 상단바 */
    header {
      position: sticky; top: 0; z-index: 10; background: var(--card); border-bottom: 1px solid var(--line);
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; display: flex; align-items: center; gap: 10px;
    }
    header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; white-space: nowrap; }
    .pill.admin { background: var(--admin-bg); color: var(--admin); border-color: transparent; font-weight: 600; }
    .pill.user { background: var(--brand-soft); color: var(--brand); border-color: transparent; font-weight: 600; }
    .iconbtn { border: 0; background: none; padding: 6px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; }
    .iconbtn:hover { background: var(--bg); }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main { max-width: 820px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
    main.bare { padding-bottom: 32px; }
    .banner { background: var(--warn-bg); color: var(--warn); padding: 8px 16px; font-size: 14px; text-align: center; }

    /* 하단 탭 */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
      display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      flex: 1; max-width: 140px; border: 0; background: none; padding: 8px 4px 10px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted);
    }
    nav button .i { font-size: 20px; line-height: 1.2; }
    nav button.on { color: var(--brand); font-weight: 600; }

    /* 공통 요소 */
    h2 { font-size: 20px; margin: 4px 0 12px; }
    h3 { font-size: 16px; margin: 0 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .narrow { max-width: 400px; margin: 8vh auto 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 16px;
    }
    textarea { min-height: 64px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px;
      border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .btn.block { width: 100%; margin-top: 16px; }
    .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--err); border: 1px solid var(--line); }
    .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { min-width: 0; }
    .grow { flex: 1; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .err { color: var(--err); }
    .right { text-align: right; }
    .num { font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .toolbar .grow { min-width: 160px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
    .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; cursor: pointer; }
    .chip.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .switch:last-child { border-bottom: 0; }
    .switch input { width: 22px; height: 22px; flex: none; accent-color: var(--brand); }

    /* 상품 목록 */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%;
    }
    .item:hover { border-color: var(--brand); }
    .thumb { width: 44px; height: 44px; border-radius: 8px; background: var(--bg) center/cover no-repeat; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 20px; }
    .item .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock { text-align: right; flex: none; }
    .stock b { font-size: 20px; font-variant-numeric: tabular-nums; }
    .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px; font-weight: 600; }
    .tag.out { background: var(--err-bg); color: var(--err); }
    .tag.low { background: var(--warn-bg); color: var(--warn); }
    .tag.ok { background: var(--ok-bg); color: var(--ok); }
    .tag.off { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
    .tag.IN { background: transparent; color: var(--in); border: 1px solid currentColor; }
    .tag.OUT { background: transparent; color: var(--out); border: 1px solid currentColor; }
    .tag.ADJUST { background: var(--admin-bg); color: var(--admin); }
    .tag.CANCEL { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

    /* 기록 */
    .mv { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .mv:last-child { border-bottom: 0; }
    .mv .q { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
    .mv.canceled .t, .mv.canceled .q { text-decoration: line-through; color: var(--muted); }

    /* 대시보드 */
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .tile .k { font-size: 13px; color: var(--muted); }
    .tile .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .tile.alert .v { color: var(--err); }
    .chart { position: relative; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart .axis { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .chart .grid { stroke: var(--line); stroke-width: 1; }
    .chart .hit { fill: transparent; cursor: pointer; }
    .chart .hit:hover, .chart .hit.on { fill: var(--line); fill-opacity: .45; }
    .legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; align-items: center; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .tip {
      position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15); white-space: nowrap; transform: translate(-50%, -100%);
    }
    table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
    table.data th, table.data td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
    table.data th:first-child, table.data td:first-child { text-align: left; }
    table.data th { color: var(--muted); font-weight: 500; }

    /* 모달 */
    .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
    .sheet {
      background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
      border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
      animation: up .18s ease-out;
    }
    @media (min-width: 640px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
    @keyframes up { from { transform: translateY(30px); opacity: 0; } }
    .sheet-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sheet-h h3 { flex: 1; margin: 0; font-size: 18px; }
    .bigstock { text-align: center; padding: 10px 0 4px; }
    .bigstock b { font-size: 44px; font-variant-numeric: tabular-nums; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; background: var(--bg); padding: 10px; font-weight: 600; cursor: pointer; }
    .seg button.on.IN { background: var(--in); color: #fff; }
    .seg button.on.OUT { background: var(--out); color: #fff; }
    .qty { display: grid; grid-template-columns: 52px 1fr 52px; gap: 6px; }
    .qty button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; font-size: 22px; cursor: pointer; }
    .qty input { text-align: center; font-size: 22px; font-weight: 700; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
    .hero-img { width: 100%; max-height: 220px; object-fit: contain; border-radius: 10px; background: var(--bg); margin-bottom: 8px; }
    video.scan { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4/3; object-fit: cover; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .actions .btn { flex: 1; }

    .toast {
      position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
    }
    .toast.bad { background: var(--err); color: #fff; }
    .loading { text-align: center; padding: 48px 0; color: var(--muted); }
    .cat-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; margin-bottom: 6px; }
    .cat-row .btn { padding: 6px 10px; }
    .subtabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <header id="hdr" class="hidden">
    <h1 id="title">재고 관리</h1>
    <button id="mode" class="pill hidden" data-act="toggleMode"></button>
    <button id="sync" class="iconbtn" data-act="refresh" title="새로고침" aria-label="새로고침">⟳</button>
  </header>
  <div id="banner" class="banner hidden"></div>
  <main id="main"><div class="loading">불러오는 중…</div></main>
  <nav id="nav" class="hidden"></nav>
  <div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>

<script>
  // Apps Script 웹앱 배포 URL (배포 > 배포 관리 에서 복사). 비워두면 앱 첫 화면에서 입력받습니다.
  const API_URL = '';
  const VERSION = '1.0.0';

  // ================================================================ 상태 / 유틸
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const S = {
    api: API_URL || store.get('inv_api') || '',
    token: store.get('inv_token') || '',
    user: null, settings: {}, categories: [], products: [], dbUrl: '',
    mode: store.get('inv_mode') || 'admin',
    tab: '', q: '', cat: '', filter: 'all', sort: 'name',
    log: null, dash: null, users: null, catEdit: null, sub: 'cat',
    offline: false, busy: 0,
  };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = new Intl.NumberFormat('ko-KR', { maximumFractionDigits: 3 });
  const num = (n) => nf.format(Number(n) || 0);
  const money = (n) => num(n) + ' ' + esc(S.settings.currency || '');
  const signed = (n) => (n > 0 ? '+' : '') + num(n);
  const isAdmin = () => S.user && S.user.role === 'admin';
  const adminView = () => isAdmin() && S.mode === 'admin';
  const canMove = () => isAdmin() || S.settings.userCanMove === 'true';
  const showCost = () => adminView() || (S.settings.userCanSeeCost === 'true' && S.products.some((p) => 'cost' in p));
  const today = (offset) => {
    const d = new Date(Date.now() + (offset || 0) * 864e5);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };
  const TYPE = { IN: '입고', OUT: '출고', ADJUST: '조정', CANCEL: '취소' };
  const ROLE = { admin: '관리자', user: '사용자' };

  function stockState(p) {
    if (!p.active) return ['off', '판매중지'];
    if (p.stock <= 0) return ['out', '⛔ 품절'];
    if (p.stock <= p.minStock) return ['low', '⚠ 부족'];
    return ['ok', '✓ 정상'];
  }
  const pLabel = (p) => p.name + (p.option ? ' / ' + p.option : '');

  let toastTimer;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), bad ? 4500 : 2200);
  }

  function setBusy(d) {
    S.busy += d;
    $('sync').innerHTML = S.busy > 0 ? '<span class="spin">⟳</span>' : '⟳';
  }

  async function api(action, data) {
    if (!S.api) throw new Error('서버 주소가 없습니다.');
    setBusy(1);
    try {
      let res;
      try {
        res = await fetch(S.api, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS preflight 회피
          body: JSON.stringify(Object.assign({ action, token: S.token }, data || {})),
        });
      } catch (e) {
        const err = new Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.');
        err.network = true;
        throw err;
      }
      const text = await res.text();
      let out;
      try {
        out = JSON.parse(text);
      } catch (e) {
        const plain = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
        throw new Error('서버 응답 오류 (HTTP ' + res.status + '): ' + plain.slice(0, 140));
      }
      if (!out.ok) {
        if (out.code === 'AUTH' && action !== 'login') { logoutLocal(); toast(out.error, true); }
        const err = new Error(out.error || '오류');
        err.code = out.code;
        throw err;
      }
      return out;
    } finally {
      setBusy(-1);
    }
  }

  // 버튼을 잠그고 작업 실행, 오류는 토스트로
  async function run(btn, fn) {
    if (btn) btn.disabled = true;
    try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) btn.disabled = false; }
  }

  function saveCache() {
    store.set('inv_cache', JSON.stringify({ user: S.user, settings: S.settings, categories: S.categories, products: S.products, dbUrl: S.dbUrl }));
  }
  function applyBoot(b) {
    S.user = b.user; S.settings = b.settings || {}; S.categories = b.categories || []; S.products = b.products || []; S.dbUrl = b.dbUrl || '';
    if (!isAdmin()) S.mode = 'user';
  }
  function upsertProduct(p) {
    const i = S.products.findIndex((x) => x.id === p.id);
    if (i >= 0) S.products[i] = Object.assign({}, S.products[i], p); else S.products.push(p);
    saveCache();
  }
  function logoutLocal() {
    S.token = ''; S.user = null; S.products = []; S.dash = S.log = S.users = null;
    store.del('inv_token'); store.del('inv_cache');
    render();
  }

  // ================================================================ 시작
  async function start() {
    if (!S.api) return render();
    if (S.token) {
      const cached = store.get('inv_cache');
      if (cached) { try { applyBoot(JSON.parse(cached)); render(); } catch (e) {} }
      return refresh();
    }
    S.view = 'loading'; render();
    try {
      const st = await api('status');
      S.view = st.needsSetup ? 'setup' : 'login';
      S.shopName = st.shopName;
    } catch (e) {
      S.view = 'login';
      S.startError = e.message;
    }
    render();
  }

  async function refresh() {
    try {
      const b = await api('bootstrap');
      applyBoot(b);
      saveCache();
      S.offline = false;
      if (S.tab === 'dash') S.dash = null;
      if (S.tab === 'log') S.log = null;
      if (S.tab === 'manage') S.users = null;
      render();
    } catch (e) {
      if (e.network && S.user) { S.offline = true; render(); }
      else if (e.code !== 'AUTH') {
        toast(e.message, true);
        if (!S.user) { S.startError = e.message; render(); }
      }
    }
  }

  // ================================================================ 렌더링
  function tabsFor() {
    if (adminView()) return [['dash', '📊', '대시보드'], ['products', '📦', '상품'], ['log', '🧾', '입출고 기록'], ['manage', '⚙️', '관리'], ['me', '👤', '내 정보']];
    return [['stock', '📦', '재고'], ['mine', '🧾', '내 기록'], ['me', '👤', '내 정보']];
  }

  function render() {
    const logged = !!(S.token && S.user);
    $('hdr').classList.toggle('hidden', !logged);
    $('nav').classList.toggle('hidden', !logged);
    $('main').classList.toggle('bare', !logged);
    $('banner').classList.toggle('hidden', !(logged && S.offline));
    $('banner').textContent = '오프라인 — 마지막으로 받은 데이터를 보여주는 중입니다.';
    if (!S.api) return renderConfig();
    if (!logged) {
      if (S.view === 'setup') return renderSetup();
      if (S.view === 'loading') { $('main').innerHTML = '<div class="loading">불러오는 중…</div>'; return; }
      return renderLogin();
    }
    document.title = S.settings.shopName || '재고 관리';

  function filtered() {
    const q = S.q.trim().toLowerCase();
    let list = S.products.filter((p) => {
      if (!adminView() && !p.active) return false;
      if (S.cat && p.category !== S.cat) return false;
      if (S.filter === 'low' && !(p.active && p.stock > 0 && p.stock <= p.minStock)) return false;
      if (S.filter === 'out' && !(p.active && p.stock <= 0)) return false;
      if (S.filter === 'off' && p.active) return false;
      if (q && ![p.name, p.option, p.sku, p.barcode, p.location, p.category, p.memo].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    const sorts = {
      name: (a, b) => a.name.localeCompare(b.name, 'ko'),
      stock: (a, b) => (a.stock - a.minStock) - (b.stock - b.minStock),
      updated: (a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)),
      sku: (a, b) => String(a.sku).localeCompare(String(b.sku), 'ko', { numeric: true }),
    };
    return list.sort(sorts[S.sort] || sorts.name);
  }

  function drawChart() {
    const box = $('chart');
    if (!box || !S.dash) return;
    box.innerHTML = chartSvg(S.dash.days, Math.max(280, box.clientWidth || 320));
    bindChart(S.dash.days);
  }
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });

  // 2개 계열(입고/출고) 묶음 막대. 막대 끝 4px 둥글게, 막대 사이 2px 간격, 날짜별 호버/탭 툴팁.
  function chartSvg(days, W) {
    const H = 200, L = 40, R = 4, T = 10, B = 24;
    const max = Math.max(1, ...days.flatMap((d) => [d.in, d.out]));
    const step = niceStep(max / 4);
    const top = Math.ceil(max / step) * step;
    const y = (v) => T + (H - T - B) * (1 - v / top);
    const band = (W - L - R) / days.length;
    const bw = Math.max(6, Math.min(22, band * 0.3));
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 입고와 출고 수량 막대 차트">`;
    for (let v = 0; v <= top + 1e-9; v += step) {
      s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${num(v)}</text>`;
    }
    days.forEach((d, i) => {
      const cx = L + band * i + band / 2;
      s += `<rect class="hit" data-i="${i}" x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" rx="6"/>`;
      s += bar(cx - bw - 1, bw, y(d.in), y(0), 'var(--in)');
      s += bar(cx + 1, bw, y(d.out), y(0), 'var(--out)');
      s += `<text class="axis" x="${cx}" y="${H - 8}" text-anchor="middle">${d.date.slice(5).replace('-', '/')}</text>`;
    });
    return s + '</svg><div class="tip hidden" id="tip"></div>';
  }
  function bar(x, w, yTop, yBase, color) {
    const h = yBase - yTop;
    if (h <= 0) return '';
    const r = Math.min(4, h, w / 2);
    return `<path pointer-events="none" fill="${color}" d="M${x},${yBase} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yBase} Z"/>`;
  }
  function niceStep(raw) {
    const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9))));
    const n = raw / p;
    return Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p);
  }
  function chartTable(days) {

  function bindChart(days) {
    const box = $('chart'), tip = $('tip');
    if (!box) return;
    const show = (el) => {
      box.querySelectorAll('.hit.on').forEach((h) => h.classList.remove('on'));
      const d = days[+el.dataset.i];
      el.classList.add('on');
      tip.innerHTML = `<b>${d.date}</b><br><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--in)"></i> 입고 ${num(d.in)} &nbsp; <i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--out)"></i> 출고 ${num(d.out)}`;
      const br = box.getBoundingClientRect(), r = el.getBoundingClientRect();
      tip.style.left = Math.min(Math.max(r.left - br.left + r.width / 2, 70), br.width - 70) + 'px';
      tip.style.top = (r.top - br.top + 6) + 'px';
      tip.classList.remove('hidden');
    };
    box.querySelectorAll('.hit').forEach((h) => {
      h.addEventListener('mouseenter', () => show(h));
      h.addEventListener('click', () => show(h));
    });
    box.addEventListener('mouseleave', () => { tip.classList.add('hidden'); box.querySelectorAll('.hit.on').forEach((h) => h.classList.remove('on')); });
  }

  function openModal(html) {

  $('modal').addEventListener('click', (e) => { if (e.target === $('modal')) closeModal(); });

  let scanStream = null, scanTimer = null;
  function stopScan() {
    clearInterval(scanTimer);
    if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
    scanStream = null;
  }
  // 바코드 스캔 (BarcodeDetector 지원 브라우저: Android Chrome 등). 결과를 cb 로 전달.
  async function scan(cb, keepHtml) {
    const prev = keepHtml ? $('sheet').innerHTML : null;
    const values = keepHtml ? Array.from($('sheet').querySelectorAll('input,textarea,select')).map((i) => [i.name, i.type === 'checkbox' ? i.checked : i.value]) : null;
    const back = () => {
      stopScan();
      if (prev == null) return closeModal();
      $('sheet').innerHTML = prev;
      values.forEach(([n, v]) => { const el = n && $('sheet').querySelector(`[name="${n}"]`); if (el) { if (el.type === 'checkbox') el.checked = v; else el.value = v; } });
    };
    const html = `<div class="sheet-h"><h3>바코드 스캔</h3><button class="iconbtn" id="scan-x" aria-label="닫기">✕</button></div>
      <video class="scan" id="scan-v" playsinline muted></video><p class="small muted">바코드를 화면 가운데에 맞춰 주세요.</p>`;
    if (keepHtml) $('sheet').innerHTML = html; else openModal(html);
    $('scan-x').onclick = back;
    try {
      const det = new BarcodeDetector();
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = $('scan-v');
      v.srcObject = scanStream;
      await v.play();
      scanTimer = setInterval(async () => {
        try {
          const codes = await det.detect(v);
          if (codes.length) { const c = codes[0].rawValue; back(); if (navigator.vibrate) navigator.vibrate(60); cb(c); }
        } catch (e) {}
      }, 250);
    } catch (e) {
      back();
      toast('카메라를 사용할 수 없습니다: ' + e.message, true);
    }
  }

  // ================================================================ CSV
  const COLS = [['sku', '상품코드'], ['name', '상품명'], ['category', '카테고리'], ['option', '옵션'], ['unit', '단위'],
    ['price', '판매가'], ['cost', '원가'], ['stock', '재고'], ['minStock', '안전재고'], ['location', '위치'],
    ['barcode', '바코드'], ['imageUrl', '이미지URL'], ['memo', '메모'], ['active', '판매중']];
  // 쉼표를 소수점으로 쓰는 지역(프랑스 등)의 엑셀은 세미콜론 CSV 를 기대함
  const DELIM = (1.5).toLocaleString().includes(',') ? ';' : ',';

  function toCsv(rows) {
    const cell = (v) => { const s = String(v == null ? '' : v); return /[",;\n\r]/.test(s) || /^[=+\-@]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return '﻿' + rows.map((r) => r.map(cell).join(DELIM)).join('\r\n');
  }
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function parseCsv(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const d = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') && !first.includes(',') ? '\t' : ',');
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim() !== ''));
  }
  function csvToProducts(rows) {
    const norm = (s) => s.trim().toLowerCase().replace(/[\s_()]/g, '');
    const alias = {};
    COLS.forEach(([k, ko]) => { alias[norm(k)] = k; alias[norm(ko)] = k; });
    Object.assign(alias, { 상품번호: 'sku', 코드: 'sku', 품번: 'sku', 품명: 'name', 이름: 'name', 분류: 'category', 가격: 'price', 수량: 'stock', 현재재고: 'stock', 재고수량: 'stock', 최소재고: 'minStock', 이미지: 'imageUrl', 활성: 'active' });
    const head = rows[0].map((h) => alias[norm(h)] || null);
    if (!head.includes('name') && !head.includes('sku')) throw new Error('첫 줄에 "상품명" 또는 "상품코드" 열이 필요합니다.');
    return rows.slice(1).map((r) => {
      const o = {};
      head.forEach((k, i) => {
        if (!k) return;
        let v = (r[i] || '').trim();
        if (k === 'active' && v !== '') v = /^(true|1|y|yes|예|o|판매|판매중)$/i.test(v) ? 'TRUE' : 'FALSE';
        if (['price', 'cost', 'stock', 'minStock'].includes(k)) v = v.replace(/[^\d.,\-]/g, '').replace(',', '.');
        o[k] = v;
      });
      return o;
    });
  }

  async function importCsv(file) {
    let rows;
    try { rows = csvToProducts(parseCsv(await file.text())); } catch (e) { return toast(e.message, true); }
    if (!rows.length) return toast('데이터 행이 없습니다.', true);
    const known = new Set(S.products.map((p) => String(p.sku).toLowerCase()).filter(Boolean));
    const upd = rows.filter((r) => r.sku && known.has(r.sku.toLowerCase())).length;
    const keys = COLS.filter(([k]) => rows.some((r) => r[k] !== undefined));
    openModal(`
      <div class="sheet-h"><h3>CSV 가져오기</h3><button class="iconbtn" data-act="close" aria-label="닫기">✕</button></div>
      <p>${esc(file.name)} — <b>${rows.length}</b>행 (수정 약 ${upd}, 추가 약 ${rows.length - upd})</p>
      <div style="overflow-x:auto"><table class="data"><thead><tr>${keys.map((k) => `<th>${k[1]}</th>`).join('')}</tr></thead>
      <tbody>${rows.slice(0, 5).map((r) => `<tr>${keys.map(([k]) => `<td>${esc(r[k] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      ${rows.length > 5 ? `<p class="small muted">… 외 ${rows.length - 5}행</p>` : ''}
      <button class="btn block" id="b-import">가져오기 실행</button>`);
    $('b-import').onclick = (e) => run(e.target, async () => {
      const r = await api('importProducts', { rows });
      closeModal();
      toast(`추가 ${r.added} · 수정 ${r.updated}${r.skipped.length ? ` · 건너뜀 ${r.skipped.length} (상품명 없음: ${r.skipped.slice(0, 5).join(', ')}행)` : ''}`);
      S.catEdit = null;
      await refresh();
    });
  }

  // ================================================================ 이벤트
  const ACTS = {
    tab: (el) => { S.tab = el.dataset.tab; if (S.tab === 'dash') S.dash = null; if (S.tab === 'log' && S.log) S.log.items = null; render(); window.scrollTo(0, 0); },
    refresh: () => refresh(),
    toggleMode: () => { S.mode = adminView() ? 'user' : 'admin'; store.set('inv_mode', S.mode); S.tab = ''; render(); toast(adminView() ? '관리자 모드' : '사용자 모드 (직원이 보는 화면)'); },
    filter: (el) => { S.filter = el.dataset.f; render(); },
    openProduct: (el) => openProduct(el.dataset.id),
    close: () => closeModal(),
    seg: (el) => {
      const f = el.closest('form');
      f.querySelectorAll('.seg button').forEach((b) => b.classList.toggle('on', b === el));
      f.type.value = el.dataset.t;
      $('b-move').textContent = (el.dataset.t === 'IN' ? '입고' : '출고') + ' 저장';
    },
    qty: (el) => { const i = $('f-qty'); i.value = Math.max(1, Math.round((parseFloat(i.value.replace(',', '.')) || 0) + +el.dataset.d)); },
    editProduct: (el) => editProduct(el.dataset.id),
    adjust: (el) => adjustDialog(el.dataset.id),
    deleteProduct: (el) => {
      const p = S.products.find((x) => x.id === el.dataset.id);
      if (!confirm(`"${pLabel(p)}" 상품을 삭제할까요?\n입출고 기록은 남습니다. 숨기기만 하려면 수정에서 '판매 중'을 끄세요.`)) return;
      run(el, async () => { await api('deleteProduct', { id: p.id }); S.products = S.products.filter((x) => x.id !== p.id); saveCache(); closeModal(); render(); toast('삭제했습니다.'); });
    },
    cancelMove: (el) => {
      if (!confirm('이 기록을 취소할까요? 재고가 반대로 되돌려지고 취소 기록이 남습니다.')) return;
      run(el, async () => { const r = await api('cancelMovement', { id: el.dataset.id }); upsertProduct(r.product); S.log.items = null; S.dash = null; render(); toast('취소했습니다.'); });
    },
    gotoLow: () => { S.tab = 'products'; S.filter = 'low'; S.sort = 'stock'; render(); },
    chartTable: (el) => { const t = $('chart-table'); t.classList.toggle('hidden'); $('chart').classList.toggle('hidden'); el.textContent = t.classList.contains('hidden') ? '표로 보기' : '차트로 보기'; },
    exportProducts: () => {
      const cost = showCost();
      const cols = COLS.filter(([k]) => cost || k !== 'cost');
      download(`상품_${today()}.csv`, toCsv([cols.map((c) => c[1])].concat(S.products.map((p) => cols.map(([k]) => (k === 'active' ? (p.active ? 'TRUE' : 'FALSE') : p[k]))))));
    },
    exportLog: () => {
      const L = S.log;
      if (!L || !L.items) return;
      download(`입출고_${L.from}_${L.to}.csv`, toCsv([['일시', '구분', '상품코드', '상품', '수량', '이전', '이후', '작업자', '메모', '취소됨']]
        .concat(L.items.map((m) => [m.time, TYPE[m.type] || m.type, m.sku, m.productName, m.qty, m.before, m.after, m.userName, m.note, m.canceled ? 'Y' : '']))));
    },
    sub: (el) => { S.sub = el.dataset.sub; if (S.sub === 'cat') S.catEdit = null; render(); },
    catAdd: () => { syncCats(); S.catEdit.push({ name: '', oldName: '' }); render(); const ins = document.querySelectorAll('[data-cat]'); if (ins.length) ins[ins.length - 1].focus(); },
    catDel: (el) => {
      syncCats();
      const c = S.catEdit[+el.dataset.i];
      const n = c.oldName ? S.products.filter((p) => p.category === c.oldName).length : 0;
      if (n && !confirm(`"${c.oldName}" 카테고리에 상품 ${n}개가 있습니다. 삭제하면 해당 상품은 카테고리가 비워집니다. (저장을 눌러야 적용)`)) return;
      S.catEdit.splice(+el.dataset.i, 1); render();
    },
    catMove: (el) => {
      syncCats();
      const i = +el.dataset.i, j = i + +el.dataset.d;
      if (j < 0 || j >= S.catEdit.length) return;
      [S.catEdit[i], S.catEdit[j]] = [S.catEdit[j], S.catEdit[i]]; render();
    },
    catSave: (el) => run(el, async () => {
      syncCats();
      const r = await api('saveCategories', { items: S.catEdit.filter((c) => c.name.trim()) });
      S.categories = r.categories; S.products = mergeProducts(r.products);
      S.catEdit = null; saveCache(); render(); toast('카테고리를 저장했습니다.');
    }),
    editUser: (el) => editUser(el.dataset.id),
    deleteUser: (el) => {
      const u = S.users.find((x) => x.id === el.dataset.id);
      if (!confirm(`${u.name} (@${u.username}) 사용자를 삭제할까요?\n기록은 남습니다. 잠시 막으려면 '활성'을 끄세요.`)) return;
      run(el, async () => { await api('deleteUser', { id: u.id }); S.users = S.users.filter((x) => x.id !== u.id); closeModal(); render(); toast('삭제했습니다.'); });
    },
    scanSearch: () => scan((code) => {
      const hits = S.products.filter((p) => p.barcode === code || p.sku === code);
      if (hits.length === 1) return openProduct(hits[0].id);
      S.q = code; render();
      if (!hits.length) toast('일치하는 상품이 없습니다: ' + code, true);
    }),
    scanField: () => scan((code) => { const i = $('sheet').querySelector('[name=barcode]'); if (i) i.value = code; }, true),
    changeApi: () => { if (API_URL) return; if (S.token && !confirm('서버 주소를 바꾸면 로그아웃됩니다. 계속할까요?')) return; store.del('inv_api'); S.api = ''; logoutLocal(); },
    logout: (el) => { if (!confirm('로그아웃할까요?')) return; api('logout').catch(() => {}); logoutLocal(); },
  };
  function syncCats() { document.querySelectorAll('[data-cat]').forEach((i) => { S.catEdit[+i.dataset.cat].name = i.value; }); }
  function mergeProducts(list) {
    const by = Object.fromEntries(list.map((p) => [p.id, p]));
    return S.products.map((p) => (by[p.id] ? Object.assign({}, p, { category: by[p.id].category }) : p));
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || !ACTS[el.dataset.act]) return;
    e.preventDefault();
    ACTS[el.dataset.act](el);
  });
  document.addEventListener('change', (e) => { if (e.target.id === 'csvfile' && e.target.files[0]) { importCsv(e.target.files[0]); e.target.value = ''; } });

  const FORMS = {
    config: async (f) => {
      let url = f.api.value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error('script.google.com 으로 시작하는 웹 앱 URL 을 입력하세요.');
      S.api = url;
      try { await api('status'); } catch (e) { S.api = ''; throw e; }
      store.set('inv_api', url);
      S.startError = '';
      start();
    },
    setup: async (f) => {
      const r = await api('setupAdmin', { name: f.name.value, username: f.username.value, password: f.password.value });
      loggedIn(r);
    },
    login: async (f) => {
      const r = await api('login', { username: f.username.value, password: f.password.value });
      loggedIn(r);
    },
    move: async (f) => {
      const r = await api('move', { productId: f.dataset.id, type: f.type.value, qty: f.qty.value, note: f.note.value });
      upsertProduct(r.product);
      S.dash = null;
      closeModal(); render();
      toast(`${TYPE[r.movement.type]} ${num(Math.abs(r.movement.qty))} → 재고 ${num(r.product.stock)}`);
    },
    adjust: async (f) => {
      const r = await api('adjust', { productId: f.dataset.id, stock: f.stock.value.replace(',', '.'), note: f.note.value });
      upsertProduct(r.product); S.dash = null;
      closeModal(); render(); toast(`조정 ${signed(r.movement.qty)} → 재고 ${num(r.product.stock)}`);
    },
    product: async (f) => {
      const data = {};
      ['name', 'sku', 'option', 'category', 'unit', 'price', 'cost', 'minStock', 'location', 'barcode', 'imageUrl', 'memo'].forEach((k) => { data[k] = f[k].value; });
      data.active = f.active.checked;
      if (f.dataset.id) data.id = f.dataset.id; else data.stock = (f.stock.value || '0').replace(',', '.');
      const r = await api('saveProduct', { product: data });
      upsertProduct(r.product); S.categories = r.categories; S.catEdit = null; S.dash = null;
      closeModal(); render(); toast(f.dataset.id ? '저장했습니다.' : '상품을 추가했습니다.');
    },
    user: async (f) => {
      const d = { name: f.name.value, username: f.username.value, role: f.role.value, active: f.active.checked };
      if (f.password.value) d.password = f.password.value;
      if (f.dataset.id) d.id = f.dataset.id;
      const r = await api('saveUser', { user: d });
      const i = S.users.findIndex((x) => x.id === r.user.id);
      if (i >= 0) S.users[i] = r.user; else S.users.push(r.user);
      if (r.user.id === S.user.id) { S.user = r.user; saveCache(); }
      closeModal(); render(); toast('저장했습니다.');
    },
    settings: async (f) => {
      const s = { shopName: f.shopName.value, currency: f.currency.value, lowStockDefault: f.lowStockDefault.value };
      ['userCanMove', 'userCanSeeCost', 'allowNegative'].forEach((k) => { s[k] = f[k].checked ? 'true' : 'false'; });
      const r = await api('saveSettings', { settings: s });
      S.settings = r.settings; saveCache(); render(); toast('설정을 저장했습니다.');
    },
    password: async (f) => {
      const r = await api('changePassword', { oldPassword: f.oldPassword.value, newPassword: f.newPassword.value });
      S.token = r.token; store.set('inv_token', r.token);
      f.reset(); toast('비밀번호를 변경했습니다. 다른 기기는 다시 로그인해야 합니다.');
    },
    logFilter: async (f) => {
      Object.assign(S.log, { from: f.from.value, to: f.to.value, type: f.type.value, q: f.q.value, items: null });
      render();
    },
  };
  function loggedIn(r) {
    S.token = r.token; store.set('inv_token', r.token);
    S.user = r.user; S.mode = r.user.role === 'admin' ? 'admin' : 'user'; store.set('inv_mode', S.mode);
    S.tab = '';
    refresh();
  }
  document.addEventListener('submit', (e) => {
    const f = e.target.closest('[data-form]');
    if (!f || !FORMS[f.dataset.form]) return;
    e.preventDefault();
    run(f.querySelector('button:not([type=button])'), () => FORMS[f.dataset.form](f));
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('online', () => { if (S.offline) refresh(); });
  start();
</script>
</body>
</html>
