name: Fidyo daily export

# 매일 밤 실행. cron 은 UTC 기준입니다.
#   21:30 UTC = 23:30 파리(여름/CEST) / 22:30 파리(겨울/CET)
#   → 어느 쪽이든 파리 늦은 저녁(같은 날)이라 "오늘" 데이터가 잡힙니다.
# "Run workflow" 버튼으로 수동 실행도 됩니다. (예약은 main 브랜치에서만 동작)
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch & upload
        env:
          FIDYO_USER: ${{ secrets.FIDYO_USER }}
          FIDYO_PASS: ${{ secrets.FIDYO_PASS }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node fidyo_fetch.mjs

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidyo-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
