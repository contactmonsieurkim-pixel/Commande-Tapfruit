name: Fidyo daily export

# 매일 새벽 실행 → "어제(영업이 끝난 완전한 하루)" 데이터를 받아옵니다.
#   cron 02:20 UTC = 04:20 파리(여름) / 03:20 파리(겨울)
#   스크립트가 어제 날짜를 직접 지정하므로, 예약이 몇 시간 밀려도 안전합니다.
# "Run workflow" 버튼으로 수동 실행도 됩니다. (예약은 main 브랜치에서만 동작)
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: npm install playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Fetch & upload
        env:
          FIDYO_USER: ${{ secrets.FIDYO_USER }}
          FIDYO_PASS: ${{ secrets.FIDYO_PASS }}
          UPLOAD_URL: ${{ secrets.UPLOAD_URL }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
        run: node fidyo_fetch.mjs

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidyo-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
