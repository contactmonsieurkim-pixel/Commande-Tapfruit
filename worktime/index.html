<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Work Time</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1f6f54">
  <style>
    :root {
      --bg: #f3f5f4; --card: #ffffff; --text: #1d2420; --muted: #66706b;
      --brand: #1f6f54; --brand-ink: #ffffff; --ok: #1f8a4c; --err: #c0392b;
      --warn-bg: #fff3cd; --warn-ink: #6b5200; --line: #dfe4e1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121614; --card: #1c211e; --text: #e8ece9; --muted: #9aa49f;
        --brand: #3fae86; --brand-ink: #0b1510; --ok: #4cc27f; --err: #ff7b6b;
        --warn-bg: #3a3112; --warn-ink: #f2d675; --line: #2c3430;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: flex-start; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px 24px;
    }
    main { width: 100%; max-width: 420px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header h1 { font-size: 18px; margin: 0; }
    .who { color: var(--muted); font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .hidden { display: none !important; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
    input {
      width: 100%; font-size: 18px; padding: 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); color: var(--text);
    }
    button {
      width: 100%; font-size: 17px; font-weight: 600; padding: 14px; margin-top: 16px;
      border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink); cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
    button.link { background: none; color: var(--muted); width: auto; padding: 4px; margin: 0; font-weight: 400; font-size: 14px; }
    button:disabled { opacity: .5; }
    .big { text-align: center; padding: 8px 0; }
    .big .icon { font-size: 48px; line-height: 1; }
    .big .action { font-size: 28px; font-weight: 700; margin-top: 8px; letter-spacing: .5px; }
    .big .stamp { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); } .err { color: var(--err); }
    .notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 12px; font-size: 15px; }
    .hint { color: var(--muted); text-align: center; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Work Time</h1>
    <span class="who"><span id="who"></span> <button id="logout" class="link hidden">Log out</button></span>
  </header>

  <!-- 로그인 -->
  <section id="v-login" class="card hidden">
    <p style="margin-top:0">Log in once on this phone.</p>
    <form id="f-login">
      <label for="name">Name</label>
      <input id="name" autocomplete="username" required>
      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <button type="submit">Log in</button>
    </form>
    <p id="login-msg" class="err"></p>
  </section>

  <!-- 대기 화면 -->
  <section id="v-home" class="card hidden">
    <div class="big">
      <div class="icon">📲</div>
      <p class="hint">Tap the <b>START</b> or <b>END</b> tag with your phone.</p>
    </div>
  </section>

  <!-- 처리 중 / 결과 -->
  <section id="v-result" class="card hidden">
    <div class="big">
      <div class="icon" id="r-icon">⏳</div>
      <div class="action" id="r-action"></div>
      <div class="stamp" id="r-stamp"></div>
      <p id="r-msg"></p>
    </div>
    <button id="b-modify" class="secondary hidden">Request time change</button>
  </section>

  <!-- 시간 변경 요청 -->
  <section id="v-modify" class="card hidden">
    <p class="notice">The time you enter will be reviewed and may be corrected after verification.</p>
    <form id="f-modify">
      <label for="m-time">Actual time</label>
      <input id="m-time" type="time" required>
      <button type="submit">Send request</button>
      <button type="button" id="b-cancel" class="secondary">Cancel</button>
    </form>
    <p id="m-msg" class="err"></p>
  </section>
</main>

<script>
  // Apps Script 웹앱 배포 URL (배포 > 배포 관리 에서 복사)
  const API_URL = 'https://script.google.com/macros/s/AKfycbwAsI9mtqQC34_IuSd4YjmAgpoi91DwFxPUdkBzV73Ix0fvXYrqFW0au4Ii3ejKf5AipQ/exec';

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  let lastTap = null;

  function show(view) {
    for (const v of ['login', 'home', 'result', 'modify']) $('v-' + v).classList.toggle('hidden', v !== view);
    const name = store.get('wt_name');
    $('who').textContent = name || '';
    $('logout').classList.toggle('hidden', !name);
  }

  async function api(body) {
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS preflight 회피
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw new Error('fetch: ' + e.message);
    }
    const text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      // 서버가 JSON 대신 오류 페이지를 돌려준 경우: 원인 파악용으로 앞부분을 보여줌
      const plain = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      throw new Error('HTTP ' + res.status + ': ' + plain.slice(0, 160));
    }
  }

  const detail = (e) => ' (' + e.message + ')';

  // 1) 태그로 열렸으면 URL 파라미터를 꺼내고 주소창에서 즉시 지움 (새로고침/복사 방지)
  function takeTagParams() {
    const q = new URLSearchParams(location.search);
    if (q.has('p') && q.has('a') && q.has('c')) {
      sessionStorage.setItem('wt_pending', JSON.stringify({ a: q.get('a'), p: q.get('p'), c: q.get('c') }));
      history.replaceState(null, '', location.pathname);
    }
    const raw = sessionStorage.getItem('wt_pending');
    return raw ? JSON.parse(raw) : null;
  }

  function result(icon, action, stamp, msg, cls) {
    $('r-icon').textContent = icon;
    $('r-action').textContent = action;
    $('r-stamp').textContent = stamp;
    $('r-msg').textContent = msg;
    $('r-msg').className = cls || '';
    show('result');
  }

  async function submitTap(tap) {
    $('b-modify').classList.add('hidden');
    result('⏳', '', '', 'Saving…');
    let r;
    try {
      r = await api({ action: 'tap', token: store.get('wt_token'), a: tap.a, p: tap.p, c: tap.c });
    } catch (e) {
      // 네트워크 오류: 같은 태그 값으로 재시도 가능하도록 pending 유지
      result('⚠️', '', '', 'Network problem. Check your connection and tap the tag again.' + detail(e), 'err');
      return;
    }
    sessionStorage.removeItem('wt_pending');
    if (r.ok) {
      lastTap = r;
      result('✅', r.info, r.date + '  ' + r.time, 'Saved. Thank you!', 'ok');
      $('b-modify').classList.remove('hidden');
    } else if (r.code === 'AUTH') {
      sessionStorage.setItem('wt_pending', JSON.stringify(tap));
      logout(r.error);
    } else {
      result('❌', '', '', r.error, 'err');
    }
  }

  function logout(msg) {
    store.del('wt_token'); store.del('wt_name');
    $('login-msg').textContent = msg || '';
    show('login');
  }

  $('f-login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = ev.submitter; btn.disabled = true;
    $('login-msg').textContent = '';
    try {
      const r = await api({ action: 'login', name: $('name').value, pin: $('pin').value });
      if (!r.ok) { $('login-msg').textContent = r.error; return; }
      store.set('wt_token', r.token); store.set('wt_name', r.name);
      $('pin').value = '';
      const pending = takeTagParams();
      pending ? submitTap(pending) : show('home');
    } catch (e) {
      $('login-msg').textContent = 'Network problem. Please try again.' + detail(e);
    } finally {
      btn.disabled = false;
    }
  });

  $('logout').addEventListener('click', () => logout());

  $('b-modify').addEventListener('click', () => {
    $('m-time').value = lastTap ? lastTap.time : '';
    $('m-msg').textContent = '';
    show('modify');
  });
  $('b-cancel').addEventListener('click', () => show('result'));

  $('f-modify').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = ev.submitter; btn.disabled = true;
    try {
      const r = await api({ action: 'modify', token: store.get('wt_token'), editToken: lastTap.editToken, time: $('m-time').value });
      if (!r.ok) { $('m-msg').textContent = r.error; return; }
      $('b-modify').classList.add('hidden');
      result('📝', lastTap.info, lastTap.date + '  ' + lastTap.time,
             'Time change requested: ' + r.time + '. Your manager will review it.', 'ok');
    } catch (e) {
      $('m-msg').textContent = 'Network problem. Please try again.' + detail(e);
    } finally {
      btn.disabled = false;
    }
  });

  // 시작
  const pending = takeTagParams();
  if (!store.get('wt_token')) show('login');
  else if (pending) submitTap(pending);
  else show('home');
</script>
</body>
</html>
