<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapfruit Ordering</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#FBFBF9; --surface:#FFFFFF; --surface-2:#F5F6F2; --border:#E6E7E1; --border-strong:#D5D8CE;
    --ink:#1C241F; --muted:#6C776E; --faint:#9AA399;
    --accent:#2D6A4F; --accent-ink:#1B4332; --accent-soft:#E7F1EA;
    --warn:#A8570F; --warn-soft:#F6ECE0; --danger:#B0361F;
    --font:'Hanken Grotesk',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
    --shadow:0 1px 2px rgba(28,36,31,.05),0 8px 24px -16px rgba(28,36,31,.18);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#13170F; --surface:#1A1F17; --surface-2:#222820; --border:#2C3328; --border-strong:#3B4335;
    --ink:#E9EEE7; --muted:#9EA99E; --faint:#727D6D;
    --accent:#74C69D; --accent-ink:#B7E4C7; --accent-soft:#1E2A22;
    --warn:#E0975A; --warn-soft:#29221A; --danger:#E08267;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }}
  :root[data-theme="dark"]{
    --bg:#13170F; --surface:#1A1F17; --surface-2:#222820; --border:#2C3328; --border-strong:#3B4335;
    --ink:#E9EEE7; --muted:#9EA99E; --faint:#727D6D;
    --accent:#74C69D; --accent-ink:#B7E4C7; --accent-soft:#1E2A22;
    --warn:#E0975A; --warn-soft:#29221A; --danger:#E08267;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:1180px;margin:0 auto;padding:20px}
  /* topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
    display:grid;place-items:center;font-size:20px;border:1px solid var(--border)}
  h1{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
  .sub{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .src{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--border);
    background:var(--surface);padding:5px 10px;border-radius:99px;white-space:nowrap}
  .src.live{color:var(--accent);border-color:var(--accent)}
  /* layout */
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  .catalog{min-width:0}
  /* filter chips */
  .filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .chip{font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--muted);
    background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:99px;
    cursor:pointer;transition:all .12s;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--border-strong);color:var(--ink)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .n{font-family:var(--mono);font-size:11px;opacity:.7}
  .chip.on .n{opacity:.85}
  /* group */
  .group{margin-bottom:22px}
  .group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:4px;position:sticky;top:0;
    background:linear-gradient(var(--bg) 70%,transparent);z-index:2}
  .group-name{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
  .group-min{font-family:var(--mono);font-size:11px;color:var(--muted)}
  /* item row */
  .row{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;
    padding:10px 8px;border-radius:10px;border:1px solid transparent;transition:background .1s}
  .row:hover{background:var(--surface)}
  .row.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .cell{min-width:0}
  .name{font-size:14px;line-height:1.35;font-weight:500}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;
    font-family:var(--mono);font-size:11px;color:var(--muted)}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--faint)}
  .par{color:var(--accent);font-weight:500}
  .supsel{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--surface);
    border:1px solid var(--border);border-radius:6px;padding:2px 4px}
  .suppill{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .price{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
  .price b{color:var(--ink);font-weight:500}
  .price small{display:block;font-size:10px;color:var(--faint)}
  /* qty stepper */
  .qty{display:flex;align-items:center;gap:0;border:1px solid var(--border-strong);
    border-radius:9px;overflow:hidden;background:var(--surface)}
  .qbtn{width:32px;height:34px;border:none;background:var(--surface);color:var(--ink);
    font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .1s}
  .qbtn:hover{background:var(--surface-2);color:var(--accent)}
  .qbtn:active{background:var(--accent-soft)}
  .qin{width:46px;height:34px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);
    background:transparent;color:var(--ink);text-align:center;font-family:var(--mono);font-size:14px;
    -moz-appearance:textfield}
  .qin::-webkit-outer-spin-button,.qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qin:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .row.on .qin{font-weight:500}
  /* summary */
  .summary{position:sticky;top:16px;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .sum-head{padding:16px 18px;border-bottom:1px solid var(--border)}
  .sum-head h2{margin:0;font-size:14px;font-weight:600}
  .sum-head p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .field{padding:14px 18px;border-bottom:1px solid var(--border)}
  .field label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px}
  .field select{width:100%;font-family:var(--font);font-size:13.5px;color:var(--ink);background:var(--bg);
    border:1px solid var(--border);border-radius:8px;padding:9px 10px;cursor:pointer}
  .field select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
  .breakdown{padding:8px 18px;max-height:min(42vh,360px);overflow:auto}
  .brk{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
    border-bottom:1px solid var(--border)}
  .brk:last-child{border-bottom:none}
  .brk-l{min-width:0}
  .brk-name{font-size:13px;font-weight:500}
  .brk-status{font-family:var(--mono);font-size:11px;margin-top:2px}
  .brk-status.met{color:var(--accent)}
  .brk-status.under{color:var(--warn)}
  .brk-val{font-family:var(--mono);font-size:13px;font-weight:500;white-space:nowrap}
  .empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .sum-foot{padding:16px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
  .total{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .total span{font-size:13px;color:var(--muted)}
  .total b{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.01em}
  .btn{width:100%;font-family:var(--font);font-size:14px;font-weight:600;padding:12px;border-radius:10px;
    border:none;background:var(--accent);color:#fff;cursor:pointer;transition:all .14s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{background:var(--border-strong);color:var(--muted);cursor:not-allowed}
  .btn.ok{background:var(--accent-ink)}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:8px;font-weight:500}
  .btn.ghost:hover{color:var(--ink);border-color:var(--border-strong);filter:none}
  .review{margin-top:10px}
  .review textarea{width:100%;height:120px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
    color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;resize:vertical}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:99;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--danger);color:#fff}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    .summary{position:static;order:-1}
    .group-head{position:static;background:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">🧾</div>
      <div>
        <h1>Supplier Order Sheet</h1>
        <p class="sub">Weekly kitchen ordering · <span id="dateLabel"></span></p>
      </div>
    </div>
    <div class="src" id="srcBadge">Sample data</div>
  </div>

  <div class="layout">
    <main class="catalog">
      <div class="filters" id="filters"></div>
      <div id="list"></div>
    </main>

    <aside class="summary">
      <div class="sum-head">
        <h2>Order summary</h2>
        <p id="refCount">No items yet</p>
      </div>
      <div class="field">
        <label for="executor">Ordered by</label>
        <select id="executor"></select>
      </div>
      <div class="breakdown" id="breakdown">
        <div class="empty">Set quantities with the − / + buttons or by typing.<br>Totals appear here per supplier.</div>
      </div>
      <div class="sum-foot">
        <div class="total"><span>Grand total</span><b id="grand">0,00 €</b></div>
        <button class="btn" id="place" onclick="place()">Place order</button>
        <button class="btn ghost" id="clearBtn" onclick="clearAll()">Clear all</button>
        <div class="review" id="review" hidden>
          <textarea id="reviewText" readonly></textarea>
        </div>
      </div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

const SEED_MANAGERS = /*__MANAGERS__*/["Yishan LEE","Sunghee KIM","Namheon KIM"];
const MIN_ORDER = {Metro:400,Tapfruit:50,"Leaf Market":200,Beauvallet:200,Acemart:200,Internet:0};
const LS='tapfruit_order_v1';

let items = SEED.slice();
let managers = SEED_MANAGERS.slice();
let live = false;
let filter = 'All';
const qty = {};          // id -> number
const choice = {};       // id -> chosen supplier (locked when ordered)
let executor = '';

/* ---------- helpers ---------- */
const eur = n => (n||0).toFixed(2).replace('.',',')+' €';
const $ = s => document.querySelector(s);
function primary(it){ return it.suppliers[0]; }
function effSupplier(it){
  if(choice[it.id]) return choice[it.id];
  if(filter!=='All' && it.suppliers.includes(filter)) return filter;
  return primary(it);
}
function sizeStr(it){
  if(it.gramsPerOrderUnit!=null){
    const g=it.gramsPerOrderUnit;
    return g>=1000 ? (g/1000).toString().replace('.',',')+' kg' : g+' g';
  }
  if(it.piecesPerOrderUnit!=null) return '×'+it.piecesPerOrderUnit;
  return '';
}
function supplierList(){
  const order=['Metro','Tapfruit','Leaf Market','Beauvallet','Acemart','Internet'];
  const present=new Set(); items.forEach(i=>i.suppliers.forEach(s=>present.add(s)));
  return order.filter(s=>present.has(s));
}

/* ---------- filters ---------- */
function renderFilters(){
  const el=$('#filters'); el.innerHTML='';
  const mk=(label,val,n)=>{
    const b=document.createElement('button');
    b.className='chip'+(filter===val?' on':'');
    b.innerHTML=label+(n!=null?' <span class="n">'+n+'</span>':'');
    b.onclick=()=>{filter=val;renderFilters();renderList();};
    el.appendChild(b);
  };
  mk('All','All',items.length);
  supplierList().forEach(s=>mk(s,s,items.filter(i=>i.suppliers.includes(s)).length));
}

/* ---------- catalog ---------- */
function itemRow(it){
  const q=qty[it.id]||0;
  const row=document.createElement('div');
  row.className='row'+(q>0?' on':'');
  row.id='row-'+it.id;

  const cell=document.createElement('div'); cell.className='cell';
  let meta='<span>'+it.orderUnit+'</span>';
  const sz=sizeStr(it); if(sz){meta+='<span class="dot"></span><span>'+sz+'</span>';}
  if(it.parLevel!=null){meta+='<span class="dot"></span><span class="par">par '+it.parLevel+'</span>';}
  cell.innerHTML='<div class="name">'+it.name+'</div><div class="meta" id="meta-'+it.id+'">'+meta+'</div>';
  // supplier control
  const metaEl=cell.querySelector('.meta');
  metaEl.appendChild(document.createElement('span')).className='dot';
  if(it.suppliers.length>1){
    const sel=document.createElement('select'); sel.className='supsel';
    it.suppliers.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
    sel.value=effSupplier(it);
    sel.onchange=()=>{choice[it.id]=sel.value;renderSummary();save();};
    metaEl.appendChild(sel);
  }else{
    const p=document.createElement('span'); p.className='suppill'; p.textContent=it.suppliers[0];
    metaEl.appendChild(p);
  }

  const price=document.createElement('div'); price.className='price';
  price.innerHTML='<b>'+eur(it.unitPrice)+'</b><small>/ '+it.orderUnit+'</small>';

  const ctrl=document.createElement('div'); ctrl.className='qty';
  const minus=document.createElement('button'); minus.className='qbtn'; minus.textContent='−';
  minus.setAttribute('aria-label','decrease'); minus.onclick=()=>bump(it.id,-1);
  const inp=document.createElement('input'); inp.className='qin'; inp.type='number'; inp.min='0';
  inp.inputMode='numeric'; inp.value=q; inp.id='q-'+it.id;
  inp.setAttribute('aria-label','quantity for '+it.name);
  inp.oninput=()=>setQty(it.id,parseInt(inp.value,10));
  const plus=document.createElement('button'); plus.className='qbtn'; plus.textContent='+';
  plus.setAttribute('aria-label','increase'); plus.onclick=()=>bump(it.id,1);
  ctrl.append(minus,inp,plus);

  row.append(cell,price,ctrl);
  return row;
}
function renderList(){
  const el=$('#list'); el.innerHTML='';
  if(filter==='All'){
    supplierList().forEach(sup=>{
      const group=items.filter(i=>primary(i)===sup);
      if(!group.length) return;
      const wrap=document.createElement('div'); wrap.className='group';
      const head=document.createElement('div'); head.className='group-head';
      head.innerHTML='<span class="group-name">'+sup+'</span><span class="group-min">min '+eur(MIN_ORDER[sup]||0)+' · '+group.length+' items</span>';
      wrap.appendChild(head);
      group.forEach(it=>wrap.appendChild(itemRow(it)));
      el.appendChild(wrap);
    });
  }else{
    const group=items.filter(i=>i.suppliers.includes(filter));
    const wrap=document.createElement('div'); wrap.className='group';
    const head=document.createElement('div'); head.className='group-head';
    head.innerHTML='<span class="group-name">'+filter+'</span><span class="group-min">min '+eur(MIN_ORDER[filter]||0)+' · '+group.length+' items</span>';
    wrap.appendChild(head);
    group.forEach(it=>wrap.appendChild(itemRow(it)));
    el.appendChild(wrap);
  }
}

/* ---------- qty ---------- */
function lockChoice(id){ const it=items.find(i=>i.id===id); if(it && !choice[id]) choice[id]=effSupplier(it); }
function setQty(id,val){
  let v=isNaN(val)?0:Math.max(0,val);
  qty[id]=v;
  if(v>0) lockChoice(id); else delete choice[id];
  const row=$('#row-'+id); if(row) row.className='row'+(v>0?' on':'');
  renderSummary(); save();
}
function bump(id,d){
  const v=Math.max(0,(qty[id]||0)+d);
  const inp=$('#q-'+id); if(inp) inp.value=v;
  setQty(id,v);
}

/* ---------- summary ---------- */
function computed(){
  const bySup={}; let total=0, refs=0;
  items.forEach(it=>{
    const q=qty[it.id]||0; if(q<=0) return;
    refs++; const s=effSupplier(it); const line=q*(it.unitPrice||0); total+=line;
    (bySup[s]=bySup[s]||{sub:0,lines:[]});
    bySup[s].sub+=line;
    bySup[s].lines.push({id:it.id,name:it.name,supplier:s,orderUnit:it.orderUnit,qty:q,
      unitPrice:it.unitPrice,lineTotal:line,supplierRef:it.supplierRef});
  });
  return {bySup,total,refs};
}
function renderSummary(){
  const {bySup,total,refs}=computed();
  $('#grand').textContent=eur(total);
  $('#refCount').textContent = refs? (refs+' item'+(refs>1?'s':'')+' selected') : 'No items yet';
  const bd=$('#breakdown');
  const order=supplierList().filter(s=>bySup[s]);
  if(!order.length){
    bd.innerHTML='<div class="empty">Set quantities with the − / + buttons or by typing.<br>Totals appear here per supplier.</div>';
  }else{
    bd.innerHTML='';
    order.forEach(s=>{
      const sub=bySup[s].sub, min=MIN_ORDER[s]||0, met=sub>=min;
      const div=document.createElement('div'); div.className='brk';
      const status = met ? '<span class="brk-status met">✓ minimum met</span>'
        : '<span class="brk-status under">+'+eur(min-sub)+' to reach '+eur(min)+'</span>';
      div.innerHTML='<div class="brk-l"><div class="brk-name">'+s+'</div>'+status+'</div>'
        +'<div class="brk-val">'+eur(sub)+'</div>';
      bd.appendChild(div);
    });
  }
  $('#place').disabled = refs===0;
  $('#clearBtn').disabled = refs===0;
}

/* ---------- persistence ---------- */
function save(){ try{ localStorage.setItem(LS,JSON.stringify({qty,choice,executor,filter})); }catch(e){} }
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(LS)||'{}');
    if(s.qty) Object.assign(qty,s.qty);
    if(s.choice) Object.assign(choice,s.choice);
    if(s.executor) executor=s.executor;
    if(s.filter) filter=s.filter;
  }catch(e){}
}
function clearAll(){
  Object.keys(qty).forEach(k=>delete qty[k]);
  Object.keys(choice).forEach(k=>delete choice[k]);
  $('#review').hidden=true;
  renderList(); renderSummary(); save(); toast('Cleared');
}

/* ---------- managers ---------- */
function renderManagers(){
  const sel=$('#executor'); sel.innerHTML='';
  const ph=document.createElement('option'); ph.value=''; ph.textContent='Select a manager…'; sel.appendChild(ph);
  managers.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
  sel.value=executor||'';
  sel.onchange=()=>{executor=sel.value;save();};
}

/* ---------- place / export ---------- */
function orderPayload(){
  const {bySup,total,refs}=computed();
  const suppliers=supplierList().filter(s=>bySup[s]).map(s=>({
    name:s, subtotal:bySup[s].sub, min:MIN_ORDER[s]||0, met:bySup[s].sub>=(MIN_ORDER[s]||0),
    lines:bySup[s].lines
  }));
  return {executor, date:new Date().toISOString(), refs, total, suppliers};
}
function orderText(p){
  let out='TAPFRUIT ORDER  —  '+new Date(p.date).toLocaleDateString('en-GB')+'\nOrdered by: '+(p.executor||'?')+'\n';
  p.suppliers.forEach(s=>{
    out+='\n['+s.name+']  '+eur(s.subtotal)+(s.met?'  (min ok)':'  (BELOW min '+eur(s.min)+')')+'\n';
    s.lines.forEach(l=>{ out+='  '+String(l.qty).padStart(3)+' × '+l.name+(l.supplierRef?'  #'+l.supplierRef:'')+'  ('+eur(l.lineTotal)+')\n'; });
  });
  out+='\nGRAND TOTAL: '+eur(p.total);
  return out;
}
function place(){
  if(!executor){ toast('Choose who is ordering first',true); $('#executor').focus(); return; }
  const p=orderPayload();
  if(!p.refs){ toast('No items selected',true); return; }
  const under=p.suppliers.filter(s=>!s.met && s.min>0);
  if(under.length && !confirmUnder(under)) return;
  const btn=$('#place');
  if(live && typeof google!=='undefined'){
    btn.disabled=true; btn.textContent='Saving…';
    google.script.run.withSuccessHandler(()=>{
      btn.classList.add('ok'); btn.textContent='✓ Order saved';
      toast('Order saved to the sheet');
      setTimeout(()=>{btn.classList.remove('ok');btn.textContent='Place order';btn.disabled=false;},3500);
    }).withFailureHandler(err=>{
      btn.disabled=false; btn.textContent='Place order'; toast('Save failed: '+err.message,true);
    }).saveOrder(p);
  }else{
    const txt=orderText(p);
    $('#review').hidden=false; const ta=$('#reviewText'); ta.value=txt; ta.select();
    let copied=false;
    try{ navigator.clipboard.writeText(txt); copied=true; }catch(e){}
    toast(copied?'Order copied to clipboard':'Order ready — select & copy below');
  }
}
let underAck=false;
function confirmUnder(under){
  if(underAck) return true;
  toast(under.map(s=>s.name+' below minimum').join(', ')+' — tap Place again to confirm',true);
  underAck=true; setTimeout(()=>underAck=false,6000);
  return false;
}

/* ---------- toast ---------- */
let tt;
function toast(msg,err){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(tt); tt=setTimeout(()=>t.className='toast',3200);
}

/* ---------- live backend (Apps Script) ---------- */
function hasGSR(){ return typeof google!=='undefined' && google.script && google.script.run; }
function goLive(){
  if(!hasGSR()) return;
  google.script.run.withSuccessHandler(data=>{
    if(!data||!data.items) return;
    items = data.items.filter(i=>Array.isArray(i.suppliers)&&i.suppliers.length)
      .map(i=>({id:i.id,name:i.name,subCategory:i.subCategory,suppliers:i.suppliers,
        orderUnit:i.orderUnit,gramsPerOrderUnit:i.gramsPerOrderUnit,piecesPerOrderUnit:i.piecesPerOrderUnit,
        unitPrice:i.unitPrice,parLevel:i.parLevel,supplierRef:i.supplierRef}));
    if(Array.isArray(data.managers)&&data.managers.length) managers=data.managers;
    if(Array.isArray(data.suppliers)) data.suppliers.forEach(s=>{ if(s&&s.name&&s.minOrder!=null) MIN_ORDER[s.name]=s.minOrder; });
    live=true; const b=$('#srcBadge'); b.textContent='Live sheet'; b.classList.add('live');
    renderManagers(); renderFilters(); renderList(); renderSummary();
  }).withFailureHandler(()=>{}).getData();
}

/* ---------- boot ---------- */
function boot(){
  $('#dateLabel').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  load();
  renderManagers(); renderFilters(); renderList(); renderSummary();
  goLive();
}
boot();
</script>
</body>
</html>
